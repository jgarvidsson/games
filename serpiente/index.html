<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🐍 Snake</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #1a2e2f 0%, #2a4a4a 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
            margin: 0;
        }

        .game-container {
            background: rgba(30, 50, 50, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            padding: 24px 20px 30px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px 12px;
        }

        .game-title {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #e2f0ec;
            font-weight: 400;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .game-title i {
            font-size: 1.8rem;
            color: #7fdb9a;
        }

        .game-title h1 {
            font-size: 1.4rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .score-area {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 16px 6px 18px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .score-box {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #c7e3d6;
            font-weight: 500;
            font-size: 1rem;
        }

        .score-box i {
            color: #f5d742;
            font-size: 1.1rem;
        }

        .reset-btn {
            background: rgba(255, 255, 255, 0.06);
            border: none;
            color: #e2f0ec;
            font-size: 1.3rem;
            width: 40px;
            height: 40px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(4px);
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.02);
        }

        .reset-btn:active {
            transform: scale(0.92);
        }

        .board-wrapper {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 32px;
            padding: 12px;
            margin: 4px 0 10px;
            box-shadow: inset 0 6px 12px rgba(0,0,0,0.4);
        }

        .board {
            display: grid;
            gap: 3px;
            justify-content: center;
            margin: 0 auto;
            aspect-ratio: 1 / 1;
            width: 100%;
            max-width: 460px;
        }

        .cell {
            aspect-ratio: 1 / 1;
            background: #3b5e5e;
            background: linear-gradient(145deg, #4b7272, #2d4a4a);
            border-radius: 6px;
            transition: 0.08s;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15);
        }

        .cell.snake {
            background: #6bc77a;
            background: radial-gradient(circle at 35% 35%, #8ce09a, #4cae5e);
            border-radius: 6px;
            box-shadow: 0 0 6px rgba(80, 200, 100, 0.3);
        }

        .cell.snake-head {
            background: #b0f0b0;
            background: radial-gradient(circle at 30% 30%, #c6f5c6, #6fcf7a);
            box-shadow: 0 0 12px rgba(100, 230, 120, 0.5);
            border-radius: 6px;
        }

        .cell.food {
            background: #f57070;
            background: radial-gradient(circle at 30% 30%, #ff8a8a, #d94040);
            border-radius: 50%;
            box-shadow: 0 0 14px rgba(255, 80, 80, 0.6);
            animation: pulse-food 0.8s infinite alternate;
        }

        @keyframes pulse-food {
            0% { transform: scale(0.9); }
            100% { transform: scale(1.1); }
        }

        .status-message {
            text-align: center;
            margin: 8px 0 4px;
            font-size: 0.95rem;
            font-weight: 400;
            color: #cfe2dc;
            min-height: 26px;
            letter-spacing: 0.3px;
            opacity: 0.8;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .difficulty-group {
            display: flex;
            gap: 8px;
        }

        .diff-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #b4d4cc;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 0.3px;
        }

        .diff-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
            color: #fff;
            box-shadow: 0 0 12px rgba(100, 200, 150, 0.08);
        }

        .diff-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .diff-btn:active {
            transform: scale(0.94);
        }

        .touch-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            max-width: 200px;
            margin: 12px auto 4px;
        }

        .touch-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #d4ece4;
            font-size: 1.4rem;
            padding: 10px 0;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .touch-btn:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.92);
        }

        .touch-btn.empty {
            background: transparent;
            border: none;
            pointer-events: none;
        }

        .touch-btn i {
            pointer-events: none;
        }

        @media (max-width: 460px) {
            .game-container { padding: 16px 12px 20px; }
            .board-wrapper { padding: 8px; }
            .game-title h1 { font-size: 1.1rem; }
            .diff-btn { padding: 4px 12px; font-size: 0.7rem; }
            .touch-btn { font-size: 1.2rem; min-height: 44px; }
            .touch-controls { max-width: 160px; gap: 4px; }
        }

        @media (max-width: 380px) {
            .cell { border-radius: 4px; }
            .touch-controls { max-width: 140px; }
            .touch-btn { font-size: 1rem; min-height: 38px; }
        }

        .game-over {
            color: #ffb0a0;
        }
        .game-win {
            color: #b0f0b0;
        }
    </style>
    <!-- Font Awesome 6 (gratuito) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="game-container" id="app">
    <div class="game-header">
        <div class="game-title">
            <i class="fas fa-snake"></i>
            <h1 data-i18n="title">Serpiente</h1>
        </div>
        <div class="score-area">
            <span class="score-box"><i class="fas fa-star"></i> <span id="scoreDisplay">0</span></span>
            <button class="reset-btn" id="resetBtn" data-i18n-aria="restart" aria-label="Reiniciar juego">
                <i class="fas fa-rotate-right" id="faceIcon"></i>
            </button>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>

    <div id="statusMessage" class="status-message">
        <i class="fas fa-arrow-up"></i> <span data-i18n="controls">Usa flechas o desliza</span>
    </div>

    <!-- Controles táctiles -->
    <div class="touch-controls" id="touchControls">
        <div class="touch-btn empty"></div>
        <div class="touch-btn" data-dir="up"><i class="fas fa-arrow-up"></i></div>
        <div class="touch-btn empty"></div>
        <div class="touch-btn" data-dir="left"><i class="fas fa-arrow-left"></i></div>
        <div class="touch-btn" data-dir="down"><i class="fas fa-arrow-down"></i></div>
        <div class="touch-btn" data-dir="right"><i class="fas fa-arrow-right"></i></div>
    </div>

    <div class="controls">
        <div class="difficulty-group">
            <button class="diff-btn active" data-speed="150" data-size="15">Fácil</button>
            <button class="diff-btn" data-speed="100" data-size="18" data-i18n="medium">Medio</button>
            <button class="diff-btn" data-speed="65" data-size="22">Difícil</button>
        </div>
        <span style="color: #7fa39a; font-size: 0.7rem; opacity: 0.6;">
            <i class="fas fa-arrow-pointer"></i> <span data-i18n="tapHint">Click / toque</span>
        </span>
    </div>
</div>

<script src="../_shared/game-lang.js"></script><script>
    (function(){
        // ---------- CONFIGURACIÓN ----------
        const DEFAULT_SIZE = 15;
        const DEFAULT_SPEED = 150; // ms por tick

        let boardSize = DEFAULT_SIZE;
        let speed = DEFAULT_SPEED;

        // Estado del juego
        let snake = [];        // array de [fila, col]
        let food = null;       // [fila, col]
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let gameOver = false;
        let win = false;
        let gameInterval = null;
        let isRunning = false;

        // DOM
        const boardEl = document.getElementById('board');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const statusMsg = document.getElementById('statusMessage');
        const resetBtn = document.getElementById('resetBtn');
        const faceIcon = document.getElementById('faceIcon');

        // Estado visible (re-render al cambiar ES/EN/JA)
        let lastStatus = 'controls';

        function renderStatus() {
            if (lastStatus === 'won') {
                statusMsg.innerHTML = '<i class="fas fa-trophy"></i> ' + GameLang.t('won');
            } else if (lastStatus === 'lost') {
                statusMsg.innerHTML = '<i class="fas fa-skull"></i> ' + GameLang.t('lost');
            } else if (lastStatus === 'started') {
                statusMsg.innerHTML = '<i class="fas fa-play"></i> ' + GameLang.t('started');
            } else {
                statusMsg.innerHTML = '<i class="fas fa-arrow-up"></i> ' + GameLang.t('controls');
            }
        }

        // Inicialización
        function initGame(size, spd) {
            boardSize = size;
            speed = spd;

            // Reiniciar variables
            snake = [];
            food = null;
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            gameOver = false;
            win = false;

            // Posición inicial de la serpiente (centro)
            const startRow = Math.floor(boardSize / 2);
            const startCol = Math.floor(boardSize / 2);
            snake = [
                [startRow, startCol],
                [startRow, startCol - 1],
                [startRow, startCol - 2]
            ];

            // Generar primera comida
            generateFood();

            // Renderizar tablero
            renderBoard();

            // Actualizar puntuación
            updateScore();

            // Mensaje
            lastStatus = 'started';
            renderStatus();
            faceIcon.className = 'fas fa-rotate-right';

            // Detener intervalo anterior
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }

            isRunning = true;
            // Iniciar bucle
            gameInterval = setInterval(gameTick, speed);
        }

        // ---------- GENERAR COMIDA ----------
        function generateFood() {
            const totalCells = boardSize * boardSize;
            if (snake.length >= totalCells) {
                // Victoria: tablero lleno
                win = true;
                gameOver = true;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                lastStatus = 'won';
                renderStatus();
                faceIcon.className = 'fas fa-star';
                return;
            }

            // Convertir snake a Set para búsqueda rápida
            const snakeSet = new Set(snake.map(cell => `${cell[0]},${cell[1]}`));
            const freeCells = [];
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if (!snakeSet.has(`${r},${c}`)) {
                        freeCells.push([r, c]);
                    }
                }
            }

            if (freeCells.length === 0) {
                win = true;
                gameOver = true;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                lastStatus = 'won';
                renderStatus();
                faceIcon.className = 'fas fa-star';
                return;
            }

            const randomIndex = Math.floor(Math.random() * freeCells.length);
            food = freeCells[randomIndex];
        }

        // ---------- RENDERIZAR TABLERO ----------
        function renderBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${boardSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${boardSize}, 1fr)`;

            // Crear celdas
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    boardEl.appendChild(cell);
                }
            }

            // Actualizar visual
            updateBoard();
        }

        // Actualizar visualización (snake, comida)
        function updateBoard() {
            const cells = boardEl.querySelectorAll('.cell');

            // Limpiar clases
            cells.forEach(cell => {
                cell.className = 'cell';
            });

            // Dibujar snake
            snake.forEach((pos, index) => {
                const [r, c] = pos;
                const cell = boardEl.querySelector(`[data-row="${r}"][data-col="${c}"]`);
                if (cell) {
                    if (index === 0) {
                        cell.classList.add('snake-head');
                    } else {
                        cell.classList.add('snake');
                    }
                }
            });

            // Dibujar comida
            if (food) {
                const [fr, fc] = food;
                const cell = boardEl.querySelector(`[data-row="${fr}"][data-col="${fc}"]`);
                if (cell) {
                    cell.classList.add('food');
                }
            }
        }

        // ---------- ACTUALIZAR PUNTUACIÓN ----------
        function updateScore() {
            scoreDisplay.textContent = score;
        }

        // ---------- MOVIMIENTO (TICK) ----------
        function gameTick() {
            if (gameOver || !isRunning) return;

            // Actualizar dirección
            direction = nextDirection;

            // Calcular nueva cabeza
            const head = snake[0];
            let newHeadRow = head[0];
            let newHeadCol = head[1];

            switch (direction) {
                case 'up': newHeadRow--; break;
                case 'down': newHeadRow++; break;
                case 'left': newHeadCol--; break;
                case 'right': newHeadCol++; break;
                default: break;
            }

            // Verificar colisión con paredes
            if (newHeadRow < 0 || newHeadRow >= boardSize || newHeadCol < 0 || newHeadCol >= boardSize) {
                endGame(false);
                return;
            }

            // Verificar colisión con la propia serpiente (excepto la cola si se va a eliminar)
            const willEat = food && newHeadRow === food[0] && newHeadCol === food[1];
            let snakeWithoutTail = snake.slice(0, -1); // sin la cola

            // Si no come, la cola se elimina, así que no hay colisión con ella
            const snakeToCheck = willEat ? snake : snakeWithoutTail;

            for (let i = 0; i < snakeToCheck.length; i++) {
                if (snakeToCheck[i][0] === newHeadRow && snakeToCheck[i][1] === newHeadCol) {
                    endGame(false);
                    return;
                }
            }

            // Movimiento válido: añadir nueva cabeza
            snake.unshift([newHeadRow, newHeadCol]);

            if (willEat) {
                // Comer: no eliminar cola, aumentar puntuación
                score++;
                updateScore();
                generateFood(); // generar nueva comida (puede establecer gameOver si victoria)
                if (gameOver) {
                    // si generateFood detectó victoria
                    updateBoard();
                    return;
                }
            } else {
                // No come: eliminar cola
                snake.pop();
            }

            // Actualizar visual
            updateBoard();

            // Verificar si se ganó (por si generateFood no lo hizo)
            if (snake.length === boardSize * boardSize) {
                win = true;
                gameOver = true;
                if (gameInterval) {
                    clearInterval(gameInterval);
                    gameInterval = null;
                }
                lastStatus = 'won';
                renderStatus();
                faceIcon.className = 'fas fa-star';
                updateBoard();
            }
        }

        // ---------- FIN DEL JUEGO ----------
        function endGame(isWin) {
            if (gameOver) return;
            gameOver = true;
            win = isWin || false;
            if (gameInterval) {
                clearInterval(gameInterval);
                gameInterval = null;
            }
            isRunning = false;

            if (win) {
                lastStatus = 'won';
                renderStatus();
                faceIcon.className = 'fas fa-star';
            } else {
                lastStatus = 'lost';
                renderStatus();
                faceIcon.className = 'fas fa-frown';
            }
            updateBoard();
        }

        // ---------- CAMBIAR DIRECCIÓN ----------
        function setDirection(newDir) {
            if (gameOver || !isRunning) return;
            // Evitar giro de 180 grados
            const opposites = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            if (direction !== opposites[newDir]) {
                nextDirection = newDir;
            }
        }

        // ---------- REINICIO ----------
        function resetGame() {
            // Usar la dificultad actual
            const activeDiff = document.querySelector('.diff-btn.active');
            if (activeDiff) {
                const spd = parseInt(activeDiff.dataset.speed);
                const size = parseInt(activeDiff.dataset.size);
                initGame(size, spd);
            } else {
                initGame(DEFAULT_SIZE, DEFAULT_SPEED);
            }
        }

        // ---------- CONFIGURAR DIFICULTAD ----------
        function setDifficulty(size, spd) {
            // Actualizar botones
            document.querySelectorAll('.diff-btn').forEach(btn => {
                const s = parseInt(btn.dataset.size);
                const sp = parseInt(btn.dataset.speed);
                btn.classList.toggle('active', s === size && sp === spd);
            });
            // Reiniciar con nueva dificultad
            initGame(size, spd);
        }

        // ---------- EVENTOS ----------
        document.addEventListener('DOMContentLoaded', () => {
            GameLang.init({
                es: {
                    title: 'Serpiente', restart: 'Reiniciar juego',
                    easy: 'Fácil', medium: 'Medio', hard: 'Difícil',
                    controls: 'Usa flechas o desliza', tapHint: 'Click / toque',
                    started: 'Juego iniciado', won: '¡Has ganado! 🎉',
                    lost: '¡Has perdido! Pulsa 🔄 para reiniciar'
                },
                en: {
                    title: 'Snake', restart: 'Restart game',
                    easy: 'Easy', medium: 'Medium', hard: 'Hard',
                    controls: 'Use arrows or swipe', tapHint: 'Click / tap',
                    started: 'Game started', won: 'You win! 🎉',
                    lost: 'You lose! Press 🔄 to restart'
                },
                ja: {
                    title: 'スネーク', restart: 'リスタート',
                    easy: 'かんたん', medium: 'ふつう', hard: 'むずかしい',
                    controls: '矢印キーやスワイプで操作', tapHint: 'クリック／タップ',
                    started: 'ゲーム開始', won: '勝ち！🎉',
                    lost: '負け！🔄でリスタート'
                }
            });
            GameLang.onChange = () => {
                document.title = GameLang.t('title');
                renderStatus();
            };
            document.title = GameLang.t('title');
            // Iniciar con fácil
            initGame(DEFAULT_SIZE, DEFAULT_SPEED);

            // Teclado
            document.addEventListener('keydown', (e) => {
                const key = e.key;
                e.preventDefault();
                if (key === 'ArrowUp') setDirection('up');
                else if (key === 'ArrowDown') setDirection('down');
                else if (key === 'ArrowLeft') setDirection('left');
                else if (key === 'ArrowRight') setDirection('right');
                else if (key === 'r' || key === 'R') resetGame();
            });

            // Botón reset
            resetBtn.addEventListener('click', resetGame);

            // Botones de dificultad
            document.querySelectorAll('.diff-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const size = parseInt(btn.dataset.size);
                    const spd = parseInt(btn.dataset.speed);
                    setDifficulty(size, spd);
                });
            });

            // Controles táctiles (botones)
            document.querySelectorAll('.touch-btn[data-dir]').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const dir = btn.dataset.dir;
                    setDirection(dir);
                });
                // prevenir toque doble zoom
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    const dir = btn.dataset.dir;
                    setDirection(dir);
                }, { passive: false });
            });

            // Soporte para deslizar (swipe) en el tablero
            let touchStartX = 0;
            let touchStartY = 0;
            boardEl.addEventListener('touchstart', (e) => {
                const touch = e.touches[0];
                touchStartX = touch.clientX;
                touchStartY = touch.clientY;
            }, { passive: true });

            boardEl.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (!touchStartX || !touchStartY) return;
                const touch = e.touches[0];
                const deltaX = touch.clientX - touchStartX;
                const deltaY = touch.clientY - touchStartY;
                const absX = Math.abs(deltaX);
                const absY = Math.abs(deltaY);

                if (Math.max(absX, absY) < 20) return;

                if (absX > absY) {
                    if (deltaX > 0) setDirection('right');
                    else setDirection('left');
                } else {
                    if (deltaY > 0) setDirection('down');
                    else setDirection('up');
                }
                touchStartX = 0;
                touchStartY = 0;
            }, { passive: false });

            boardEl.addEventListener('touchend', () => {
                touchStartX = 0;
                touchStartY = 0;
            }, { passive: true });

            // Prevenir contexto en el tablero
            boardEl.addEventListener('contextmenu', (e) => e.preventDefault());
        });

    })();
</script>
</body>
</html>
